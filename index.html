<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="البروتوكول الشهري">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>البروتوكول الشهري لإعادة التناغم مع المال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --bg-2:#efe8da;
  --surface:#fffefb; --surface-2:#faf5ec;
  --ink:#2c2720; --ink-soft:#6f6658; --ink-faint:#9d9484;
  --gold:#b08429; --gold-deep:#8a6417; --gold-soft:#f0e2c2;
  --line:#e5dbc8; --line-strong:#d0c2a6;
  --ok:#3f7d55; --warn:#a4642a; --on-gold:#fffdf8;
  --shadow:0 1px 2px rgba(70,52,20,.05), 0 10px 26px -14px rgba(70,52,20,.2);
  --r:14px; --spring:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box}
button{font-family:inherit;margin:0;-webkit-appearance:none;appearance:none}
html,body{margin:0;padding:0;background:var(--bg);overflow-x:hidden;max-width:100%}
body{color:var(--ink);font-family:"Noto Sans Arabic",system-ui,sans-serif;font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Sans Arabic",system-ui,sans-serif;font-weight:700;line-height:1.35}
.shell{display:grid;grid-template-columns:1fr 300px;min-height:100vh;min-width:0;max-width:100%}
.main{padding:20px 20px 120px;max-width:880px;width:100%;min-width:0;margin-inline-start:auto;padding-top:max(20px,env(safe-area-inset-top))}
.rail{border-inline-end:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--bg));padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;order:-1}
@media(max-width:940px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset-inline-start:0;top:0;height:100dvh;width:min(86vw,320px);z-index:60;transform:translateX(104%);transition:transform .38s var(--spring)}
  .rail.open{transform:translateX(0)}
  .main{padding:12px 13px 130px}
}
.scrim{display:none}
@media(max-width:940px){.scrim.on{display:block;position:fixed;inset:0;background:rgba(50,38,12,.4);z-index:55}}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:nowrap}
.titlewrap{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1;align-items:center;text-align:center}
.apptitle{font-family:"Noto Sans Arabic",sans-serif;font-size:clamp(16px,4.4vw,19px);color:var(--gold-deep);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.appsub{font-size:10px;color:var(--ink-faint);letter-spacing:1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.iconbtn.icononly{font-size:17px;line-height:1;padding:8px 13px;font-weight:700;flex:0 0 auto}
.funnel-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px}
.funnel-btn svg{pointer-events:none}
.reorder-toggle-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px}
.reorder-toggle-btn svg{pointer-events:none}
.reorder-toggle-btn.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.railnav{width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--gold-deep);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;transition:all .25s var(--spring);text-decoration:none;box-sizing:border-box}
.railnav:last-of-type{margin-bottom:16px}
.railnav:hover{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-1px)}
.railnav-pair{display:flex;gap:8px;margin-bottom:10px}
.railnav-mini{flex:1;min-width:0;text-align:center;border:1px solid var(--line);background:var(--surface);color:var(--gold-deep);
  border-radius:10px;padding:8px 6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .25s var(--spring)}
.railnav-mini:hover{border-color:var(--gold);background:var(--gold-soft)}
.brand{margin-inline-end:auto;display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:"Noto Sans Arabic",sans-serif;font-size:17px;color:var(--gold-deep)}
.brand span{font-size:10.5px;color:var(--ink-faint);letter-spacing:2.4px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;transition:all .25s var(--spring)}
.iconbtn:hover{border-color:var(--gold);color:var(--gold-deep);transform:translateY(-1px)}
.iconbtn.gold{border-color:var(--gold);color:var(--gold-deep);background:var(--gold-soft)}
.install-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px}
.install-btn svg{pointer-events:none}
.menu-toggle{display:none}
@media(max-width:940px){.menu-toggle{display:inline-block}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:9px 6px;border-radius:9px;cursor:pointer;transition:all .3s var(--spring);white-space:normal;line-height:1.3}
.tabs button.on{background:var(--surface);color:var(--gold-deep);box-shadow:var(--shadow)}
.sub-tabs{margin-top:-8px}
.prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));width:0;transition:width .5s var(--spring)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 24px}
.card.anim{animation:rise .4s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:600px){.card{padding:19px 15px}}
.eyebrow{font-size:11px;letter-spacing:2.4px;color:var(--gold);margin:0 0 8px;font-weight:600}
.card h2{margin:0 0 6px;font-size:clamp(20px,4.3vw,27px)}
.lede{color:var(--ink-soft);margin:0 0 20px;font-size:14.5px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);margin:20px 0}
.pendulum{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:12px;padding:11px 14px;margin:16px 0;font-size:13.8px;color:var(--ink-soft)}
.pendulum b{color:var(--gold-deep);font-weight:600;display:block;font-size:11px;letter-spacing:1.4px;margin-bottom:3px}
label.fl{display:block;font-size:13.5px;font-weight:600;margin:0 0 7px}
.hint{font-size:12.5px;color:var(--ink-faint);margin:-3px 0 8px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;font-size:14.5px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:90px;resize:vertical;line-height:1.8}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.field{margin-bottom:16px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .25s var(--spring)}
.opt:hover{border-color:var(--line-strong)}
.opt.sel{border-color:var(--gold);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.opt .box{flex:0 0 19px;height:19px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;font-size:11px;color:var(--on-gold);transition:all .25s var(--spring)}
.opt.radio .box{border-radius:50%}
.opt.sel .box{background:var(--gold);border-color:var(--gold)}
.opt .box::after{content:"✓";opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.opt.sel .box::after{opacity:1;transform:scale(1)}
.opt.invest.sel .box{background:var(--ok);border-color:var(--ok)}
.opt.divest .box{border-color:#e2a0bb}
.opt.divest.sel .box{background:#e2699a;border-color:#e2699a}
.opt.divest .box::after{content:"－"}
.opt .t{font-size:14.5px;font-weight:600}
.opt .d{font-size:12.8px;color:var(--ink-soft);margin-top:2px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips-row{flex-wrap:nowrap;gap:5px}
.chips-row .chip{flex:1;min-width:0;padding:7px 4px;font-size:11px;text-align:center;justify-content:center;white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 14px;font:inherit;font-size:13.5px;cursor:pointer;transition:all .25s var(--spring);color:var(--ink-soft)}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.pick{display:block;width:100%;text-align:start;margin:4px 0;padding:6px 9px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer;font:inherit;font-size:12.8px;line-height:1.6;transition:all .2s}
.pick:hover{background:var(--surface-2);border-color:var(--line)}
.pick.sel{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;padding:6px 13px;cursor:pointer;color:var(--ink-soft);transition:all .2s}
.seg button.on{background:var(--gold);color:var(--on-gold);font-weight:600}
.seg button.on.no{background:var(--ink-faint)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.row .num{flex:0 0 28px;height:28px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--gold-deep);font-weight:600}
.minibtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:9px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12.5px;line-height:1.3;transition:all .2s}
.minibtn:hover{border-color:var(--gold);color:var(--gold-deep)}
.block{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--surface-2)}
.block h4{margin:0 0 10px;font-size:14.5px;font-family:inherit;color:var(--gold-deep)}
.scorebadge{position:absolute;top:9px;left:9px;background:var(--gold);color:var(--on-gold);border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  box-shadow:var(--shadow);z-index:2;cursor:pointer}
.scorebadge.ease-easy{background:#4caf6b}
.scorebadge.ease-hard{background:#e2699a}
.scoredot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:700;flex:0 0 20px;margin-inline-end:7px;cursor:pointer}
.scoredot.ease-easy{background:#4caf6b}
.scoredot.ease-hard{background:#e2699a}
.card-undo{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);font-size:12px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;z-index:2;padding:0;margin:0;-webkit-appearance:none;appearance:none;box-shadow:none}
.card-undo:hover{border-color:#e2699a;color:#e2699a;background:#fdeef4}
.tunewrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.tunepair{display:inline-flex;align-items:center;gap:8px}
@media(max-width:600px){.tunewrap{flex-direction:column;align-items:stretch;gap:9px}.tunepair{width:100%;justify-content:space-between}}
.reveal{background:var(--surface);border:1px solid var(--gold-soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.2px;color:var(--ink-soft)}
.reveal b{color:var(--gold-deep)}
.tw{overflow-x:auto;overflow-y:auto;max-width:100%;max-height:70vh;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tw thead th{position:sticky;top:0;z-index:2}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
th,td{padding:8px 10px;border:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--gold-soft);font-weight:600;font-size:12.5px;color:var(--gold-deep);text-align:center}
.bt{min-width:660px}
.bt .rh{background:var(--surface-2);color:var(--gold-deep);font-weight:600;text-align:center;white-space:nowrap;vertical-align:middle;font-size:12.5px}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:16px}
summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--gold-deep);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"◆ ";color:var(--gold);font-size:10px}
details[open] summary{border-bottom:1px solid var(--line)}
details .in{padding:12px 14px}
.mantra{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--gold-soft);border-radius:12px;padding:16px;font-family:"Noto Sans Arabic",sans-serif;font-size:17px;line-height:2.15}
.mantra input{display:inline-block;width:auto;min-width:170px;font-family:"Noto Sans Arabic";font-size:15px;background:var(--surface);border:1px solid var(--gold);border-radius:8px;padding:5px 10px;margin:0 4px}
.note{font-size:12.8px;color:var(--ink-faint);margin-top:8px}
.empty{padding:18px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--ink-faint);font-size:13.5px;text-align:center}
.warnbox{border:1px solid var(--warn);background:#fdf3e6;border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--warn);margin:14px 0}
.okbox{border:1px solid var(--ok);background:#eef6f0;border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ok);margin:14px 0}
.faded{opacity:.6}
.out{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.9}
.nav{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--on-gold);transition:transform .3s var(--spring);box-shadow:0 6px 16px -10px var(--gold-deep)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.spacer{flex:1}
.savetag{font-size:12px;color:var(--ink-faint)}
.rail h3{font-size:11.5px;letter-spacing:2px;color:var(--gold);margin:0 0 10px;font-family:inherit;font-weight:600}
.steps{list-style:none;padding:0;margin:0 0 20px}
.steps li{font-size:13px;color:var(--ink-faint);padding:6px 9px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:all .2s}
.steps li:hover{background:var(--surface-2);color:var(--ink-soft)}
.steps li.on{background:var(--surface);color:var(--gold-deep);font-weight:600;box-shadow:var(--shadow)}
.steps li.done{color:var(--ink-soft)}
.steps li .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:0 0 6px}
.steps li.done .dot{background:var(--ok)}
.steps li.on .dot{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.log{border-top:1px solid var(--line);padding-top:14px}
.logitem{font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);margin-bottom:7px;line-height:1.5}
.logitem b{display:block;font-size:10.5px;letter-spacing:1px;color:var(--gold);font-weight:600;margin-bottom:2px}
.count{display:inline-block;background:var(--gold-soft);color:var(--gold-deep);border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600}
.plan{display:grid;gap:14px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
.pcard.done{border-color:var(--ok);background:linear-gradient(160deg,#eef8f1,#e2f4e8)}
.pcard.done h4{text-decoration:line-through;color:var(--ink-faint)}
.pcard.done .kv{opacity:.65}
.plan-check{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);
  background:var(--surface);color:#fff;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .25s var(--spring);line-height:1;padding:0;margin:0;
  -webkit-appearance:none;appearance:none;box-shadow:none}
.plan-check:hover{border-color:var(--ok)}
.plan-check.checked{background:var(--ok);border-color:var(--ok)}
.rep-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
.rep-box{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--line-strong);
  background:var(--surface);color:var(--ink-faint);font-size:10px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;margin:0;transition:all .2s var(--spring);
  -webkit-appearance:none;appearance:none;box-shadow:none}
.rep-box:hover{border-color:var(--gold)}
.rep-box.checked{background:#4caf6b;border-color:#4caf6b;color:#fff}
.rep-count{font-size:11px;color:var(--ink-faint);font-weight:700;margin-inline-start:4px}

/* بطاقة النية المالية — ذهبي فاخر (ملهم بالثراء) */
.intent-hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 24px 20px;margin-bottom:18px;
  background:linear-gradient(135deg,#f8ecc4 0%,#f0d692 38%,#e6bc63 72%,#f3d98c 100%);
  border:1px solid #d9a936;color:#241a08;
  box-shadow:0 18px 38px -22px rgba(150,108,20,.5),0 1px 0 rgba(255,255,255,.6) inset}
.intent-hero::before{content:"";position:absolute;top:-70px;left:-50px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.65),transparent 70%);pointer-events:none}
.intent-hero::after{content:"";position:absolute;bottom:-80px;right:-30px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);pointer-events:none}
.intent-progress{position:absolute;top:14px;left:16px;width:46px;height:46px}
.intent-progress::before{content:"";position:absolute;top:-5px;left:-5px;right:-5px;bottom:-5px;border-radius:50%;
  background:#fffdf6;box-shadow:0 2px 8px rgba(60,40,10,.3),0 0 0 1px rgba(138,100,23,.25);z-index:0}
.intent-progress svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.intent-progress-coin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;
  filter:drop-shadow(0 1px 2px rgba(120,80,10,.35));z-index:1}
.intent-progress .ring-fg.complete{filter:drop-shadow(0 0 4px rgba(120,210,110,.9))}
.intent-progress.tone-orange .ring-fg.complete{filter:drop-shadow(0 0 5px rgba(240,150,55,.95))}
.intent-progress.tone-green .ring-fg.complete{filter:drop-shadow(0 0 5px rgba(63,160,100,.95))}
.intent-progress .ring-fg-goal.complete{filter:drop-shadow(0 0 4px rgba(63,160,100,.95))}
.intent-progress.complete{animation:ring-pulse 1.8s ease-in-out infinite}
@keyframes ring-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ملخص اليوم */
.view-toggle{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px}
.view-toggle button{flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:9px 10px;border-radius:9px;cursor:pointer;transition:all .3s var(--spring)}
.view-toggle button.on{background:var(--surface);color:var(--gold-deep);box-shadow:var(--shadow)}
.today-hero{position:relative;overflow:hidden;border-radius:18px;padding:16px 18px;margin-bottom:16px;
  background:linear-gradient(135deg,#f8ecc4 0%,#f0d692 38%,#e6bc63 72%,#f3d98c 100%);border:1px solid #d9a936;
  display:flex;align-items:center;gap:12px;box-shadow:0 14px 30px -18px rgba(150,108,20,.5)}
.today-icon{font-size:28px;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(120,80,10,.3))}
.today-value{flex:1;text-align:center;font-family:Georgia,"Times New Roman","Amiri",serif;font-weight:700;font-size:clamp(22px,7vw,32px);
  color:#1c1305;text-shadow:0 1px 0 rgba(255,255,255,.5);word-break:break-word}
.today-hero .intent-progress{position:relative;top:auto;left:auto;flex:0 0 auto;width:48px;height:48px}
.today-heading{font-size:16px;font-weight:700;color:var(--gold-deep);margin:0 0 12px;font-family:"Noto Sans Arabic",sans-serif}
.cat-badge{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-soft)}
.filter-bar{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;margin-bottom:16px}
.filter-bar .field{margin-bottom:12px}
.active-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:16px;
  font-size:13px;color:var(--gold-deep)}
.active-filter b{color:var(--ink)}
.task-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.task-toolbar.end{justify-content:flex-end}
.task-toolbar.between{justify-content:space-between}
#undoBtn{display:none}
.undo-ring-bg{fill:none;stroke:var(--gold-soft);stroke-width:2.5}
.undo-ring-fg{fill:none;stroke:var(--gold-deep);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:88}
.undo-ic{position:relative;font-size:15px;color:var(--gold-deep);font-weight:700;z-index:1;pointer-events:none}
.undo-float{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s var(--spring)}
.undo-float.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.undo-float-btn{position:relative;width:46px;height:46px;border:0;border-radius:50%;cursor:pointer;padding:0;
  background:var(--surface);box-shadow:0 10px 24px -8px rgba(0,0,0,.35),0 0 0 1px var(--line);
  display:flex;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none}
.undo-float-btn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.cat-badge.cat-overdue{background:#fbe2ec;border-color:#f0b8cf;color:#a83a63}
.today-item{display:flex;gap:8px;align-items:stretch}
.today-reorder{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;justify-content:center}
.reorder-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-soft);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;margin:0;-webkit-appearance:none;appearance:none;transition:all .2s}
.reorder-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-deep)}
.reorder-btn:disabled{opacity:.3;cursor:not-allowed}
.routine-badge{background:#fdf1de;color:#8a6417}
.intent-label{position:relative;font-size:11.5px;letter-spacing:2.6px;color:#5a3e12;font-weight:700;margin-bottom:12px}
.intent-value{position:relative;font-family:Georgia,"Times New Roman","Amiri",serif;font-weight:700;font-size:clamp(34px,9.5vw,54px);
  letter-spacing:.5px;line-height:1.25;margin:0 0 12px;word-break:break-word;color:#1c1305;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.intent-sentence{position:relative;font-size:14.5px;color:#2a1d08;line-height:1.9;font-weight:700}
.intent-sentence b{color:#000;font-weight:800}
.intent-mission{position:relative;font-size:12.8px;color:#4a3410;margin-top:12px;padding-top:12px;
  border-top:1px solid rgba(40,26,4,.18)}
.intent-stats{position:relative;display:flex;flex-wrap:nowrap;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.stat-pill{background:rgba(255,255,255,.5);border:1px solid rgba(60,40,8,.22);border-radius:99px;
  padding:5px 10px;font-size:11px;color:#241a08;display:flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto}
.stat-pill b{color:#000;font-weight:800;font-size:12px}

/* أكورديون بطاقات الخطة */
.plan-header{cursor:pointer;display:flex;align-items:center;gap:9px}
.plan-header .tag{margin-bottom:0;flex:0 0 auto}
.plan-title{flex:1;min-width:0;margin:0;text-align:start;line-height:1.5;font-size:15px}
.plan-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.title-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.title-edit-input{flex:1}
.title-edit-btn{flex:0 0 auto;font-size:14px}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.meta-pill{background:var(--gold-soft);color:var(--gold-deep);border:1px solid var(--gold);border-radius:99px;
  padding:5px 10px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;flex:0 0 auto;width:auto}
select.meta-pill{font-family:inherit;cursor:pointer;-webkit-appearance:auto;appearance:auto;width:auto!important}
.meta-edit-btn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);
  background:var(--gold-soft);color:var(--gold-deep);font-size:12px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0;-webkit-appearance:none;appearance:none}
.eft-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.copy-icon-btn{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--gold);
  background:var(--gold-soft);color:var(--gold-deep);cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0;-webkit-appearance:none;appearance:none;transition:all .2s var(--spring)}
.copy-icon-btn:hover{background:var(--gold);color:var(--on-gold)}
.copy-icon-btn svg{pointer-events:none}
.eft-head-t{flex:1;font-weight:700;font-size:14.5px;color:var(--gold-deep)}
.timeline{display:flex;flex-direction:column}
.plan-actions{display:flex;gap:6px;flex-wrap:nowrap;margin-top:14px}
.plan-actions .btn{flex:1;padding:10px 4px;font-size:11.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ledger-hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 24px 20px;margin-bottom:18px;
  background:linear-gradient(135deg,#f8ecc4 0%,#f0d692 38%,#e6bc63 72%,#f3d98c 100%);
  border:1px solid #d9a936;color:#241a08;
  box-shadow:0 18px 38px -22px rgba(150,108,20,.5),0 1px 0 rgba(255,255,255,.6) inset}
.ledger-hero::before{content:"";position:absolute;top:-70px;left:-50px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.65),transparent 70%);pointer-events:none}
.ledger-hero::after{content:"";position:absolute;bottom:-80px;right:-30px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);pointer-events:none}
.ledger-hero-label{position:relative;font-size:11.5px;letter-spacing:2.6px;color:#5a3e12;font-weight:700;margin-bottom:12px}
.ledger-hero-value{position:relative;font-family:Georgia,"Times New Roman","Amiri",serif;font-weight:700;
  font-size:clamp(28px,8vw,44px);line-height:1.25;margin:0 0 8px;color:#1c1305;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.ledger-hero-sub{position:relative;font-size:12.5px;color:#4a3410}
.ledger-hero-stats{position:relative;display:flex;flex-wrap:nowrap;gap:6px;margin-top:14px;overflow-x:auto}
.ledger-hero-insights{position:relative;margin-top:14px;border-top:1px solid rgba(40,26,4,.18);padding-top:10px}
.ledger-hero-insights summary{color:#5a3e12;font-weight:700;font-size:12.5px;cursor:pointer}
.ledger-hero-insights .in .kv{color:#3a2708;font-size:12.5px}
.ledger-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.ledger-row.editing{padding:12px 2px}
.ledger-edit-form{flex:1}
.ledger-edit{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:var(--gold-soft);
  color:var(--gold-deep);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;margin:0;-webkit-appearance:none;appearance:none}
.ledger-edit:hover{border-color:var(--gold-deep)}
.ledger-row:last-child{border-bottom:0}
.ledger-del{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-faint);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;margin:0;-webkit-appearance:none;appearance:none}
.ledger-del:hover{border-color:#e2699a;color:#e2699a}
.ledger-row-main{flex:1;min-width:0}
.ledger-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ledger-row-amt{font-weight:800;font-size:15px;font-family:Georgia,"Times New Roman","Amiri",serif}
.ledger-row.income .ledger-row-amt{color:#2f7a4b}
.ledger-row.expense .ledger-row-amt{color:#a83a63}
.ledger-row-date{font-size:11px;color:var(--ink-faint);flex:0 0 auto}
.ledger-row-note{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.tl-item{display:flex;gap:12px}
.tl-node-col{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.tl-node{width:15px;height:15px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--ink-faint);
  box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line-strong)}
.tl-node.status-overdue{background:#e2699a;box-shadow:0 0 0 4px var(--surface),0 0 0 5px #f0b8cf}
.tl-node.status-today{background:#7ee3a8;box-shadow:0 0 0 4px var(--surface),0 0 0 5px #c8f2da}
.tl-node.status-future{background:#5b9bd5;box-shadow:0 0 0 4px var(--surface),0 0 0 5px #b7d5ee}
.tl-node.status-done{background:var(--ok);box-shadow:0 0 0 4px var(--surface),0 0 0 5px #a9dcbb}
.tl-line{flex:1;width:2px;min-height:22px;background:var(--line-strong);margin:2px 0}
.tl-line.status-overdue{background:#e2699a}
.tl-line.status-today{background:#7ee3a8}
.tl-line.status-future{background:#5b9bd5}
.tl-line.status-done{background:var(--ok)}
.tl-content{flex:1;min-width:0;padding-bottom:20px}
.tl-item:last-child .tl-content{padding-bottom:2px}
.tl-toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.tl-date{font-size:12px;color:var(--gold-deep);font-weight:700}
.tl-badge{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 9px}
.tl-badge.status-overdue{background:#fbe2ec;color:#a83a63}
.tl-badge.status-today{background:#d7f7e6;color:#1a8f5a}
.tl-badge.status-future{background:#e4eefb;color:#33628e}
.tl-badge.status-done{background:#dcefe1;color:#245c3c}
.tl-text{font-size:14px;color:var(--ink)}
.tl-text.tl-done{text-decoration:line-through;color:var(--ink-faint)}
.tl-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.pcard.hero{border-color:var(--gold);background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.pcard h4{margin:0 0 4px;font-size:15.5px;font-family:inherit}
.tag{display:inline-block;font-size:11px;letter-spacing:1.2px;color:var(--gold-deep);background:var(--gold-soft);border-radius:99px;padding:2px 10px;margin-bottom:8px;font-weight:600}
.kv{font-size:13px;color:var(--ink-soft);margin:4px 0}
.kv b{color:var(--ink);font-weight:600}
.archive-panel{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow-y:auto;padding:18px 16px 60px}
.archive-panel.open{display:block}
.arch-item{cursor:pointer}
.splash{position:fixed;inset:0;z-index:998;background:linear-gradient(160deg,var(--bg),var(--bg-2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:opacity .5s ease;opacity:1}
.splash.hide{opacity:0;pointer-events:none}
.splash-coin-img{width:84px;height:84px;margin-bottom:10px;filter:drop-shadow(0 6px 14px rgba(138,100,23,.4));
  animation:splash-pulse 1.8s ease-in-out infinite}
@keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.splash-title{font-size:22px;font-weight:800;color:var(--gold-deep)}
.splash-sub{font-size:14px;color:var(--ink-soft)}
.splash-brand{font-size:11px;letter-spacing:3px;color:var(--ink-faint);margin-top:16px;text-transform:uppercase}
.confetti-wrap{position:fixed;inset:0;z-index:997;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;top:-12px;width:8px;height:14px;opacity:.95;border-radius:1px;
  animation-name:confetti-fall;animation-timing-function:cubic-bezier(.3,0,.7,1);animation-fill-mode:forwards}
@keyframes confetti-fall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(var(--rot,360deg));opacity:.25}
}
.update-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--gold-deep);color:#fff8e6;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:700;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.4);opacity:0;transition:opacity .35s ease,transform .35s ease;z-index:996;
  pointer-events:none;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.update-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.update-banner{position:fixed;left:14px;right:14px;bottom:14px;z-index:998;
  background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.35);opacity:0;transform:translateY(16px);
  transition:opacity .35s ease,transform .35s ease;max-width:420px;margin:0 auto}
.update-banner.show{opacity:1;transform:translateY(0)}
.update-banner span{font-size:13.5px;font-weight:700;color:var(--gold-deep)}
.update-banner button{border:0;border-radius:9px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.update-banner #updateNowBtn{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--on-gold)}
.update-banner #updateLaterBtn{background:transparent;color:var(--ink-faint);padding:8px 10px}
.confirm-modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-modal.open{display:flex}
.confirm-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:26px 22px 22px;max-width:360px;width:100%;
  max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.confirm-card h3{margin:0 0 10px;font-size:19px;color:var(--gold-deep);flex:0 0 auto}
.confirm-card p{margin:0 0 20px;font-size:14px;color:var(--ink-soft);line-height:1.8}
.confirm-actions{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.confirm-actions .btn{width:100%}
#infoBody{overflow-y:auto;flex:1 1 auto;min-height:0}
.modal-close{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{border-color:var(--gold);color:var(--gold-deep)}
[data-carditem]{-webkit-user-select:none;user-select:none}
@media print{.rail,.nav,.topbar,.prog,.tabs,.scrim,.archive-panel,.confirm-modal{display:none!important}.shell{grid-template-columns:1fr}.card{box-shadow:none;border:none;padding:0}}
</style>
</head>

   const bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   const blob=new Blob([bytes],{type:"text/markdown;charset=utf-8"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;a.download="eft-session-builder-SKILL.md";
   document.body.appendChild(a);a.click();
   setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
   showUpdateToast("جاري تنزيل ملف الـ skill ✓");
 }catch(e){
   try{
     const txt=decodeURIComponent(escape(atob(EFT_SKILL_B64)));
     openInfoModal("ملف الـ skill","<div class=\"note\" style=\"margin-bottom:8px\">التنزيل المباشر مش متاح على متصفحك — انسخ النص ده واحفظه في ملف باسم SKILL.md</div><textarea id=\"skillBox\" readonly style=\"width:100%;height:200px;font-size:11px;direction:ltr;text-align:left\">"+esc(txt)+"</textarea>","<button class=\"btn\" id=\"copySkillBtn\">نسخ النص</button>");
   }catch(e2){}
 }
}
function activeActIdx(){
 const st=Array.isArray(S.actStatus)?S.actStatus:[];
 return S.acts.map((_,i)=>i).filter(i=>(S.acts[i]||"").trim()&&st[i]!=="بعد"&&st[i]!=="لا");
}
function actOrder(){
 const ne=activeActIdx();
 return (Array.isArray(S.order)&&S.order.length===ne.length&&S.order.every(i=>ne.indexOf(i)>=0))?S.order:ne;
}
function ideaBankBlock(target){
 const B=S.ideaBank||[];
 return `<details><summary>بنك الأفكار المؤجلة (${B.length})</summary><div class="in">
   <div class="note" style="margin:0 0 8px">أفكار قلت عنها «متناغم فيما بعد» — محفوظة عبر الشهور. اختبرها من جديد مع الشهر الحالي.</div>
   ${B.length?B.map((b,bi)=>`<div class="row"><div style="flex:1;font-size:14px">${esc(b.text)}<div class="note">مؤجلة من ${esc(b.from||"—")}</div></div>
     <button class="minibtn" data-brest="${bi}.${target}">اختبرها الآن</button>
     <button class="minibtn" data-bdel="${bi}">حذف</button></div>`).join(""):`<div class="note">لا توجد أفكار مؤجلة.</div>`}
   </div></details>`;
}

 if(na!==nb)return nb-na;
 const da=itemDate(a),db=itemDate(b);
 if(da&&db&&da-db)return da-db;
 if(da&&!db)return -1;
 if(!da&&db)return 1;
 return (a.rank||0)-(b.rank||0);
});
const byExecDate=list=>list.slice().sort((a,b)=>{

 if(da&&db&&da-db)return da-db;

function todayWidgetItems(){
 const items=allCommitted(),today=new Date();today.setHours(0,0,0,0);
 const out=[];
 items.forEach(it=>{
   const df=it.def||{};
   if(df.repeatType==="routine"){if(isRoutineDueToday(it))out.push({it,cat:df.routineTime==="مسائي"?"routine-evening":"routine-morning"});return;}
   if(df.repeatType==="recurring"){
     if(it.done)return;
     const dt=itemDate(it);
     if(!dt||dt.getTime()<=today.getTime())out.push({it,cat:"recurring"});
     return;
   }
   if(it.done)return;
   const dt=itemDate(it);
   if(dt&&dt.getTime()<today.getTime())out.push({it,cat:"overdue"});
   else if(dt&&dt.getTime()===today.getTime())out.push({it,cat:"today"});
 });
 const order={"routine-morning":0,"overdue":1,"today":2,"recurring":3,"routine-evening":4};
 out.sort((a,b)=>order[a.cat]-order[b.cat]);
 out.forEach((x,idx)=>{if(typeof x.it.todayRank!=="number")x.it.todayRank=idx;});
 out.sort((a,b)=>(a.it.todayRank-b.it.todayRank)||(order[a.cat]-order[b.cat]));
 return out;
}

function exportText(){
 const L=[];
 L.push(`البروتوكول الشهري لإعادة التناغم مع المال — ${when()}`);
 if(S.mission)L.push("الرسالة: "+S.mission);
 L.push("النية المالية: "+intentSentence());
 const line=(it,i)=>{const d=it.def||{};const o=[`${i+1}. ${d.what||it.text}`];
   if(d.what)o.push("   الفعل: "+it.text);
   if(startText(it))o.push("   البدء: "+startText(it));
   if(nsolve(it))o.push("   يحل من الطاقات: "+(it.solves||[]).join(" / "));
   if(d.steps)o.push("   الخطوات: "+d.steps);
   if(d.goal)o.push("   الهدف: "+d.goal);
   if(d.who)o.push("   المتأثر: "+d.who);
   if(d.out)o.push("   خارج النطاق: "+d.out);
   o.push(`   [المحور: ${it.axis||"—"} · المصدر: ${it.source}]`);return o.join("\n");};
 const m=ordered(1);
 if(m.length){L.push("");L.push("— أفعال اليوم الأول —");m.forEach((it,i)=>L.push(line(it,i)));}
 [0,1,2,3,4,5,6].forEach(d=>{const c=ordered(2,d);
   if(c.length){L.push("");L.push(`— إضافات يوم ${d+1} —`);c.forEach((it,i)=>L.push(line(it,i)));}});
 L.push("");L.push("— تغطية المحاور —");
 AXES.forEach(a=>L.push(`• ${a[0]}: ${allCommitted().filter(x=>x.axis===a[0]).length}`));
 const later=S.pool.filter(p=>!p.removed&&p.commit!=="نعم");
 if(later.length){L.push("");L.push("— مؤجّل بقرار واعٍ —");later.forEach(p=>L.push("• "+p.text));}
 L.push("");L.push("— الطاقات غير المتناغمة —");
 energyList().forEach(n=>{const e=em(n);L.push(`• ${n} (${e.type||"—"}) — شاكرا ${e.chakra||"—"}${e.interp?" — التفسير: "+e.interp:""}`);});
 if(S.cleanseNotes)L.push("بعد التنظيف: "+S.cleanseNotes);
 if(energyList().some(n=>(S.eftByEnergy[n]||"").trim())){L.push("");L.push("— برنامج EFT —");L.push(eftAllText());}
 L.push("");L.push("— اعتقادات النقص وعلاجها —");
 (S.lack||[]).forEach(b=>L.push(`• ${b} ← ${S.lackRemedy[b]||"—"}`));
 L.push("");L.push("— المشاعر المعيقة ومحفزاتها —");
 (S.blockers||[]).forEach(b=>L.push(`• ${b} ← ${S.blockerTrigger[b]||"—"}${S.blockerAffirm[b]?" — التوكيد: "+S.blockerAffirm[b]:""}`));
 L.push("");L.push("— استثمار أم صرف —");
 SPEND.forEach(i=>{if(S.spendKind[i]){const d=S.spendDecisions[i]||{};L.push(`• ${i}: ${S.spendKind[i]}${d.method?" ← "+d.method+(d.note?": "+d.note:""):""}`);}});
 if((S.ideaBank||[]).length){L.push("");L.push("— بنك الأفكار المؤجلة (للشهر القادم) —");S.ideaBank.forEach(b=>L.push(`• ${b.text} (مؤجلة من ${b.from||"—"})`));}
 L.push("");L.push("— جوانب المقاومة —");
 (S.selAspects||[]).forEach(a=>{const m2=am(a);L.push(`• ${a} — ${m2.pattern||"—"} — الجذر: ${m2.root||"—"} — الخطوة: ${m2.step||"—"}`);});
 return L.join("\n");
}

async function doPasteImport(){
 const ta=document.getElementById("importText");
 if(!ta)return;
 const apply=txt=>{
   if(!txt||!txt.trim())return false;
   ta.value=txt;
   try{ta.dispatchEvent(new Event("input",{bubbles:true}));}catch(e){}
   showUpdateToast("تم اللصق ✓ — اضغط «استرجاع من النص»");
   return true;
 };
 // 1) Clipboard API
 try{
   if(navigator.clipboard&&navigator.clipboard.readText){
     const txt=await navigator.clipboard.readText();
     if(apply(txt))return;
   }
 }catch(e){}
 // 2) execCommand paste into the focused textarea
 try{
   ta.focus();
   const before=ta.value;
   const okCmd=document.execCommand&&document.execCommand("paste");
   if(okCmd&&ta.value&&ta.value!==before){
     showUpdateToast("تم اللصق ✓ — اضغط «استرجاع من النص»");
     return;
   }
 }catch(e){}
 // 3) last resort: put the caret in place and paste on the next clipboard event
 try{
   ta.focus();
   const onPaste=ev=>{
     const txt=(ev.clipboardData||window.clipboardData||{}).getData?((ev.clipboardData||window.clipboardData).getData("text")):"";
     if(txt){ev.preventDefault();apply(txt);}
     ta.removeEventListener("paste",onPaste);
   };
   ta.addEventListener("paste",onPaste);
 }catch(e){}
 showUpdateToast("المتصفح رفض القراءة — المربع جاهز، الصق فيه مباشرة");
}

/* Word (docx) */
function crc32(buf){let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
 let crc=0xFFFFFFFF;for(let i=0;i<buf.length;i++)crc=(crc>>>8)^t[(crc^buf[i])&0xFF];return (crc^0xFFFFFFFF)>>>0;}
function zip(files){
 const enc=new TextEncoder(),parts=[],central=[];let off=0;
 const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
 files.forEach(f=>{const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
  const lh=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
  parts.push(new Uint8Array(lh),name,data);central.push({name,crc,len:data.length,off});off+=lh.length+name.length+data.length;});
 const cd=[];let cdLen=0;
 central.forEach(c=>{const h=[].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.len),u32(c.len),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
  cd.push(new Uint8Array(h),c.name);cdLen+=h.length+c.name.length;});
 const end=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(central.length),u16(central.length),u32(cdLen),u32(off),u16(0)));
 const all=parts.concat(cd,[end]);let total=0;all.forEach(a=>total+=a.length);
 const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;
}
function docx(title,body){
 const X=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
 const para=(txt,head)=>`<w:p><w:pPr><w:bidi/><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:rtl/>${head?'<w:b/><w:sz w:val="32"/>':""}</w:rPr><w:t xml:space="preserve">${X(txt)}</w:t></w:r></w:p>`;
 const paras=[para(title,true)].concat(String(body||"").split("\n").map(l=>para(l||" ",false))).join("");
 const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

async function saveWord(filename,title,body,btn){
 const bytes=docx(title,body);
 try{
  const dl=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):null;
  if(dl){await dl.save({filename,data:bytes});return;}
 }catch(e){}
 try{
  const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
 }catch(e){copy(body,btn);}
}

/* PWA */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById("installBtn");if(b)b.style.display="inline-block";});
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
function standalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
async function doInstall(){
 if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").style.display="none";return;}
 if(isIOS()){
   openInfoModal("تثبيت التطبيق","<div class=\"note\" style=\"line-height:2\">للتثبيت على الآيفون:<br>1) افتح الصفحة في متصفح <b>Safari</b> (لازم Safari تحديدًا)<br>2) اضغط على زر المشاركة ⬆︎ تحت الشاشة<br>3) اختر «إضافة إلى الشاشة الرئيسية»</div>","<button class=\"btn\" id=\"infoClose2\">تمام</button>");
 }else{
   openInfoModal("تثبيت التطبيق","<div class=\"note\" style=\"line-height:2\">لتثبيت التطبيق على شاشتك الرئيسية:<br>افتح قائمة المتصفح (عادة ⋮ فوق يمين الشاشة)<br>واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br><br>لو الخيار ده مش ظاهر، جرّب فتح الصفحة من متصفح Chrome على أندرويد.</div>","<button class=\"btn\" id=\"infoClose2\">تمام</button>");
 }
}
if(!standalone()){const b=document.getElementById("installBtn");if(b)b.style.display="inline-block";}
if("serviceWorker" in navigator&&location.protocol==="https:"){
 window.addEventListener("load",()=>{
   navigator.serviceWorker.register("sw.js").then(reg=>{
     reg.update().catch(()=>{});
     setInterval(()=>{reg.update().catch(()=>{});},60000);
     if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBanner(reg);
     reg.addEventListener("updatefound",()=>{
       const nw=reg.installing;
       if(!nw)return;
       nw.addEventListener("statechange",()=>{
         if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner(reg);
       });
     });
   }).catch(()=>{});
 });
}
try{
 if(sessionStorage.getItem("sm_just_updated")==="1"){
   sessionStorage.removeItem("sm_just_updated");
   setTimeout(()=>showUpdateToast("تم تحديث التطبيق لآخر إصدار ✓"),900);
 }
}catch(e){}
function showUpdateBanner(reg){
 if(document.getElementById("updateBanner"))return;
 const el=document.createElement("div");
 el.id="updateBanner";
 el.className="update-banner";
 el.innerHTML=`<span>🔄 نسخة جديدة من التطبيق متاحة</span><div style="display:flex;gap:8px"><button id="updateNowBtn">تحديث الآن</button><button id="updateLaterBtn" title="تجاهل">✕</button></div>`;
 document.body.appendChild(el);
 setTimeout(()=>el.classList.add("show"),30);
 document.getElementById("updateNowBtn").addEventListener("click",()=>{
   try{
     if(reg&&reg.waiting){
       navigator.serviceWorker.addEventListener("controllerchange",()=>{
         try{sessionStorage.setItem("sm_just_updated","1");}catch(e){}
         window.location.reload();
       },{once:true});
       reg.waiting.postMessage({type:"SKIP_WAITING"});
     }else{
       window.location.reload();
     }
   }catch(e){window.location.reload();}
 });
 document.getElementById("updateLaterBtn").addEventListener("click",()=>{
   el.classList.remove("show");setTimeout(()=>el.remove(),400);
 });
}

 return d;
}
